packages: []

# Resend's React renderer is optional. We send pre-rendered HTML, so avoid
# installing that peer and its build-only Prettier dependency.
autoInstallPeers: false

storeDir: .pnpm-store
packageImportMethod: copy
nodeLinker: hoisted
confirmModulesPurge: false

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  unrs-resolver: true
