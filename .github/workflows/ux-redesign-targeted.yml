name: UX Redesign Targeted

on:
  push:
    branches:
      - codex/full-website-ux-redesign

permissions:
  contents: read

jobs:
  ui-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Targeted UX tests
        run: pnpm exec vitest run --configLoader runner tests/unit/design-system-foundation.test.tsx tests/unit/confirmation-dialog-async.test.tsx tests/unit/app-navigation.test.tsx tests/unit/teaching-assignments.test.ts tests/unit/teaching-assignment-mutations.test.ts tests/unit/teaching-assignment-workspace.test.tsx tests/unit/admin-teacher-ux-contract.test.ts tests/unit/student-guardian-ux-contract.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
