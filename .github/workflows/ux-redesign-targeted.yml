name: UX Redesign Targeted

on:
  push:
    branches:
      - codex/full-website-ux-redesign

permissions:
  contents: read

jobs:
  ui-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Targeted UI tests
        run: pnpm exec vitest run --configLoader runner tests/unit/design-system-foundation.test.tsx
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  visual-reference:
    if: contains(github.event.head_commit.message, '[visual]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm db:start
      - name: Reset through legacy migration 27 and seed legacy profiles
        run: pnpm exec supabase db reset --version 202609230027
      - name: Apply current forward migrations
        run: pnpm exec supabase migration up --local
      - name: Load redesigned E2E fixtures
        run: |
          eval "$(pnpm exec supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.e2e.sql
      - name: Configure local application environment
        run: |
          eval "$(pnpm exec supabase status -o env)"
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          BREVO_API_KEY=ci-local-placeholder
          EMAIL_FROM=ci@example.test
          CRON_SECRET=ci-local-placeholder
          E2E_BASE_URL=http://127.0.0.1:3000
          EOF
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture UI reference screenshots
        run: pnpm exec playwright test tests/e2e/ui-reference-visual.spec.ts
      - name: Upload UI reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-reference-screenshots
          path: test-results/**/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
