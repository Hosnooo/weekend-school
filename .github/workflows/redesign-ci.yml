name: Redesign CI

on:
  push:
    branches:
      - main
      - codex/admin-teacher-ux-completion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
          BREVO_API_KEY: ci-build-placeholder
          EMAIL_FROM: ci@example.invalid
          CRON_SECRET: ci-build-placeholder
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm db:start
      - name: Reset through legacy migration 27 and seed legacy profiles
        run: pnpm exec supabase db reset --version 202609230027
      - name: Load Task 3 legacy teaching history fixture
        run: |
          eval "$(pnpm exec supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/fixtures/teacher_id_history_pre28.sql
      - name: Apply current forward migrations
        run: pnpm exec supabase migration up --local
      - name: Run PostgreSQL and RLS tests
        run: pnpm test:db
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm db:start
      - name: Reset through legacy migration 27 and seed legacy profiles
        run: pnpm exec supabase db reset --version 202609230027
      - name: Apply current forward migrations
        run: pnpm exec supabase migration up --local
      - name: Load redesigned E2E fixtures
        run: |
          eval "$(pnpm exec supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.e2e.sql
      - name: Configure local application environment
        run: |
          eval "$(pnpm exec supabase status -o env)"
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          BREVO_API_KEY=ci-local-placeholder
          EMAIL_FROM=ci@example.test
          CRON_SECRET=ci-local-placeholder
          E2E_BASE_URL=http://127.0.0.1:3000
          EOF
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser workflows
        run: pnpm test:e2e
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
