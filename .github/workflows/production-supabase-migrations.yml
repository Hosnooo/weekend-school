name: Production Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact 40-character main commit SHA verified by CI'
        required: true
        type: string
      apply:
        description: 'Apply the previewed migrations after release approval'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Verify exact main revision
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'revision must be a full commit SHA' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
          test "$(git rev-parse origin/main)" = "$RELEASE_REVISION" || {
            echo 'Release revision is not the current main commit' >&2
            exit 1
          }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF"
          supabase migration list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --skip-vault \
            --dry-run

      - name: Apply pending migrations
        if: ${{ inputs.apply == true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --skip-vault \
            --yes

      - name: Verify migration history after apply
        if: ${{ inputs.apply == true }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase migration list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --skip-vault \
            --dry-run
