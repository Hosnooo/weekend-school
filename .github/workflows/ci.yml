name: CI

# Pull requests run the fast, high-value release checks.
# Run Actions > CI > Run workflow > browser_suite: full for exhaustive E2E
# and historical-upgrade/concurrency tests before major releases.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_suite:
        description: "Browser coverage (full also runs historical database checks)"
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - full

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
          BREVO_API_KEY: ci-build-placeholder
          EMAIL_FROM: ci@example.invalid
          CRON_SECRET: ci-build-placeholder
        # The complete unit suite ran above; avoid rerunning critical tests.
        run: pnpm exec next build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm db:start
      - name: Reset local database
        run: pnpm db:reset
      - name: Run PostgreSQL and RLS tests
        run: pnpm test:db
      - name: Reset to the pre-role-cutover schema for upgrade compatibility
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'full' }}
        run: pnpm exec supabase db reset --version 202609230027
      - name: Load pre-role-cutover teaching history fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'full' }}
        run: |
          eval "$(pnpm exec supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/fixtures/teacher_id_history_pre_role_cutover.sql
      - name: Apply forward migrations over historical records
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'full' }}
        run: pnpm exec supabase migration up --local
      - name: Verify historical Teacher attribution
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'full' }}
        run: pnpm exec supabase test db --local supabase/fixtures/teacher_id_history_upgrade.test.sql
      - name: Verify concurrent Administrator deactivation safety
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'full' }}
        run: |
          eval "$(pnpm exec supabase status -o env)"
          export DB_URL
          bash scripts/test-last-administrator-race.sh
      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm db:start
      - name: Reset local database
        run: pnpm db:reset
      - name: Load E2E fixtures
        run: |
          eval "$(pnpm exec supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.e2e.sql
      - name: Configure local application environment
        run: |
          eval "$(pnpm exec supabase status -o env)"
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          BREVO_API_KEY=ci-local-placeholder
          EMAIL_FROM=ci@example.test
          CRON_SECRET=ci-local-placeholder
          E2E_BASE_URL=http://127.0.0.1:3000
          EOF
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # One stateful run on a fresh, isolated local database. Keep the PR
      # suite focused on genuine enrollment, authorization and report paths.
      # Exhaustive visual/locale workflows remain opt-in for major releases.
      - name: Run critical browser smoke tests
        if: ${{ github.event_name == 'pull_request' || inputs.browser_suite == 'smoke' }}
        run: |
          pnpm test:e2e \
            tests/e2e/multi-class-enrollment.spec.ts \
            tests/e2e/authorization.spec.ts \
            tests/e2e/guardian-stale-unlink.spec.ts \
            tests/e2e/english-flow.spec.ts \
            tests/e2e/arabic-flow.spec.ts \
            tests/e2e/report-delivery-workflow.spec.ts
      - name: Run full browser regression suite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.browser_suite == 'full' }}
        run: pnpm test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop
